name: CI
run-name: CI (${{ github.event_name }} on ${{ github.ref_name }})

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Test & Scope Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies and taskctl CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Strict Typing & Syntax Check
        run: |
          python3 -m py_compile $(find taskctl -name "*.py")

      - name: Git Hygiene Check
        run: |
          git diff --check

      - name: Hermetic Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Scope Auditor Verification
        run: |
          taskctl audit

      - name: Conventional Commits Verification (Push)
        if: github.event_name == 'push'
        run: |
          taskctl lint-commit --rev HEAD

      - name: Conventional Commits Verification (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          if git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            taskctl lint-commit --range "origin/${{ github.base_ref }}..HEAD"
          else
            taskctl lint-commit --rev HEAD
          fi
